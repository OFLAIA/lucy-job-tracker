# Runs the daily job digest at 6am UTC.
#
# In summer (BST, late Mar - late Oct) that lands at 7am UK time.
# In winter (GMT, late Oct - late Mar) it lands at 6am UK time.
# Most of the year is BST, so 6am UTC keeps the 7am UK target for ~7 months.
#
# The 'workflow_dispatch' trigger gives a manual "Run now" button on the
# Actions tab, useful for testing and onboarding new users.
#
# Multi-user pipeline (post-refactor):
#   1. Shared scrape: hit every company in companies/*.json, cache raw results.
#   2. Per-user loop: for each active user in users/*.json, filter cache by
#      their preferences, AI-score, render, send.
#   3. Commit updated state back so memory persists across runs.

name: Daily job digest

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  # The job needs to push state file updates (seen_jobs.json, feedback.json,
  # quote_history.json, scrape_cache/*) back to the repo so memory persists
  # across runs.
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest for all active users
        env:
          # API keys (shared across all users)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Where 'Not a match' / quote-thumb feedback replies are routed.
          # All users' feedback comes back here for manual processing in v1.
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TIMEZONE: Europe/London
        run: python main.py

      - name: Commit updated state files
        # Even if the run had no new matches for anyone, scrape_cache files
        # and quote_history.json typically update. Skip the commit cleanly
        # if nothing changed.
        run: |
          git config user.name "Job Tracker Bot"
          git config user.email "bot@job-tracker.local"
          git add state/ || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "State update from daily run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
